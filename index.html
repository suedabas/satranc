<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>checkmate</title>
        <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
        <link rel="icon" href="favicon_io/favicon.ico">
        <link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
        <meta name="theme-color" content="#9e306f">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="checkmate">
<style>
    :root { --kare: min(calc((100vw - 70px) / 8), 64px); }
    body { touch-action: manipulation; }
    table { border-collapse:collapse; }
    table { border: 10px solid #9e306f; }
    table { box-shadow: 0px 0px 10px 14px #451731;}
    table { margin: 0 auto; }
    td { width: var(--kare); height: var(--kare); text-align:center; padding:0; font-size: calc(var(--kare) * 0.75); line-height:1;}
    td { cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
    .b { background-color:bisque}
    .s { background-color:rgb(113, 110, 110)}
    .secili { background-color:#641048; opacity:0.7;}
    .hedef { background-image:radial-gradient(circle, rgba(159, 4, 113, 0.6) 22%, transparent 26%)}
    #durum { text-align:center; margin-top:30px}
    #yenilenler { text-align:center; margin-top:10px; font-size:20px; white-space:pre-line}
    #terfi { display:none; text-align:center; margin-top:10px}
    #terfi.acik { display:block}
    #terfi button { font-size:22px}
    #butonlar { text-align:center}
    button { margin:4px; padding:8px 14px; font-size:15px; border:2px solid #9e306f; background-color:white; border-radius:6px}
    button.aktif { background-color:#9e306f; color:white}
    #onlinePanel { display:none; text-align:center; margin-top:10px}
    #onlinePanel.acik { display:block}
    #kodGirdisi { font-size:18px; padding:8px; width:110px; text-align:center; text-transform:uppercase; border:2px solid #9e306f; border-radius:6px}
    #onlineDurum { margin-top:8px}
</style>
    </head>
    <body>
        <table id="tahta">
            <tr>

            </tr>
        </table>
        <p id="durum"></p>
        <div id="yenilenler"></div>
        <div id="terfi">
            <p>Piyon hangi taş olsun?</p>
            <button data-tas="n"></button>
            <button data-tas="q"></button>
            <button data-tas="r"></button>
            <button data-tas="b"></button>
        </div>
        <div id="butonlar">
            <button id="yeni">new game</button>
            <button id="modAi">AI</button>
            <button id="modIki">face to face</button>
            <button id="modOnline">online</button>
        </div>
        <div id="onlinePanel">
            <button id="onlineKur">oyun kur</button>
            <input id="kodGirdisi" placeholder="KOD" maxlength="5" autocomplete="off">
            <button id="onlineKatil">katıl</button>
            <p id="onlineDurum"></p>
        </div>
        <script src="lib/peerjs.min.js"></script>
        <script type="module" src="app.js?v=7"></script>

</html>
